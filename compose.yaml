name: innovation-news-local

services:
  mysql:
    image: mysql:8.4
    env_file:
      - ./docker/mysql.env.example
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping --host=127.0.0.1 --user=root --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - local-only

  mock-integrations:
    build:
      context: ./docker/mock
    volumes:
      - mock-certs:/certs
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import ssl,urllib.request; urllib.request.urlopen('https://localhost:8443/health', context=ssl.create_default_context(cafile='/certs/local-ca.crt'), timeout=3).read()"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - local-only

  admin:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    env_file:
      - ./docker/local.env.example
    depends_on:
      mysql:
        condition: service_healthy
      mock-integrations:
        condition: service_healthy
    volumes:
      - mock-certs:/certs:ro
    read_only: true
    tmpfs:
      - /tmp:mode=1777
      - /workspace/cache:uid=1000,gid=1000,mode=0700
      - /workspace/logs:uid=1000,gid=1000,mode=0700
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - local-only

  gateway:
    build:
      context: ./docker/gateway
    depends_on:
      admin:
        condition: service_healthy
    ports:
      - "127.0.0.1:3001:8080"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; s=socket.create_connection(('admin',3001),3); s.close()"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    networks:
      - local-only
      - host-access

volumes:
  mysql-data:
  mock-certs:

networks:
  local-only:
    internal: true
  host-access:
